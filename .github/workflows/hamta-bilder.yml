name: Hämta produktbild till högtalarsidan

on:
  push:
    branches: [hogtalare-tre-kvar]
    paths: [".github/workflows/hamta-bilder.yml"]

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hogtalare-tre-kvar
      - name: Ladda ner bilder på Moto Sound Flow i Warm Taupe
        run: |
          mkdir -p hogtalare/bilder
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          i=0
          hamta() {
            url="$1"
            case "$url" in //*) url="https:$url" ;; /*) url="https://www.komplett.se$url" ;; esac
            i=$((i+1))
            echo "Försöker $url"
            curl -fsSL -A "$UA" -o "hogtalare/bilder/moto-kandidat-$i.img" "$url" || { echo "misslyckades"; rm -f "hogtalare/bilder/moto-kandidat-$i.img"; }
          }
          hamta "https://www.komplett.se/img/p/1200/1341611.jpg"
          for sida in \
            "https://www.komplett.se/product/1341611/tv-ljud-bild/hogtalare-hi-fi/traadlos-bluetooth-hogtalare/motorola-moto-sound-flow-barbar-hogtalare-warm-taupe" \
            "https://www.galaxus.at/en/s1/product/motorola-sound-flow-warm-taupe-bluetooth-speakers-66670313" \
            "https://www.digitec.ch/en/s1/product/motorola-sound-flow-warm-taupe-12-h-bluetooth-speakers-66670313" \
            "https://aio.lv/en/product--motorola-pg38c07850--12230755"; do
            u=$(curl -fsSL -A "$UA" "$sida" 2>/dev/null | grep -oE '<meta[^>]+og:image[^>]+>' | grep -oE 'content="[^"]+"' | head -1 | sed 's/content="//;s/"$//' | sed 's/&amp;/\&/g')
            [ -n "$u" ] && hamta "$u"
          done
          file hogtalare/bilder/moto-kandidat-* || true
      - name: Spara bilderna i grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hogtalare/bilder
          git commit -m "Lägg till bildkandidater för Moto Sound Flow" || echo "Inga nya bilder"
          git push origin hogtalare-tre-kvar
