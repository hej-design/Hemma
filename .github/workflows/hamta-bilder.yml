name: Hämta produktbilder till högtalarsidan

on:
  push:
    branches: [hogtalare-sladd]
    paths: [".github/workflows/hamta-bilder.yml"]

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hogtalare-sladd
      - name: Ladda ner bilderna
        run: |
          mkdir -p hogtalare/bilder
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          H="Accept: image/jpeg,image/png,image/*;q=0.8"
          curl -fsSL -A "$UA" -H "$H" -o hogtalare/bilder/sonos-era-100-sl.img "https://media.sonos.com/images/znqtjj88/production/03b89d4e259ddfe3388083e943059f0436468258-2000x2000.png?w=1000&q=90&fit=clip&fm=png" || echo "Era misslyckades"
          curl -fsSL -A "$UA" -H "$H" -o hogtalare/bilder/homepod-mini-2.img "https://store.storeimages.cdn-apple.com/1/as-images.apple.com/is/homepod-mini-2-compare-202610?wid=386&hei=500&fmt=jpeg&qlt=90&.v=djVzOGVJcjlsSS9rUUNjK1FJOGpTM2R0S3NLeDNHMWJpNXZ1dW9IcTRPWE9SUmxLVHY2Q0ZiMjZVSFh3cjFhVHVUb3VPa2FUZVhQMFhDQnVBMWhwQTVhemRuUGZZOTdhcTM0VGg1WGR5UEE" || echo "mini 2 misslyckades"
          file hogtalare/bilder/* || true
      - name: Spara bilderna i grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hogtalare/bilder
          git commit -m "Lägg till produktbilder för sladdbundna högtalare" || echo "Inga nya bilder"
          git push origin hogtalare-sladd
