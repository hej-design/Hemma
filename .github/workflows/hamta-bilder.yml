name: Hämta produktbilder till högtalarsidan

on:
  push:
    branches: [hogtalare-fler]
    paths: [".github/workflows/hamta-bilder.yml"]

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hogtalare-fler
      - name: Ladda ner bilder och kontrollera butikssidor
        run: |
          mkdir -p hogtalare/bilder
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          hamta() {
            namn="$1"; url="$2"
            case "$url" in //*) url="https:$url" ;; esac
            echo "Försöker $namn: $url"
            curl -fsSL -A "$UA" -o "hogtalare/bilder/$namn.img" "$url" || { echo "misslyckades"; rm -f "hogtalare/bilder/$namn.img"; }
          }
          ogbild() {
            curl -fsSL -A "$UA" "$1" 2>/dev/null | grep -oE '<meta[^>]+og:image[^>]+>' | grep -oE 'content="[^"]+"' | head -1 | sed 's/content="//;s/"$//' | sed 's/&amp;/\&/g'
          }
          html=$(curl -fsSL -A "$UA" "https://store.google.com/se/product/google_home_speaker?hl=sv" || true)
          n=0
          for u in $(echo "$html" | grep -oE 'https://lh3\.googleusercontent\.com/[A-Za-z0-9_-]{40,}' | awk '!seen[$0]++' | head -24); do
            n=$((n+1)); hamta "gstore-$n" "$u=s700"
          done
          b="https://cdn11.bigcommerce.com/s-pwefhhr7pn/products/70096/images/322767/b0e9c86c0de95bf2d161f009e39f1d6ba1e626b2_428371__53441.1765558835"
          hamta "wiimbig-1" "$b.jpg?c=1"
          hamta "wiimbig-2" "$b.1280.1280.jpg?c=1"
          file hogtalare/bilder/gstore-* hogtalare/bilder/wiimbig-* || true
      - name: Spara bilderna i grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hogtalare/bilder
          git commit -m "Lägg till fler bildkandidater" || echo "Inga nya bilder"
          git push origin hogtalare-fler
