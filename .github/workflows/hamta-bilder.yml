name: Hämta produktbilder till högtalarsidan

on:
  push:
    branches: [hogtalare-svart-ok]
    paths: [".github/workflows/hamta-bilder.yml"]

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hogtalare-svart-ok
      - name: Ladda ner bilder
        run: |
          mkdir -p hogtalare/bilder
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          hamta() {
            namn="$1"; url="$2"
            case "$url" in //*) url="https:$url" ;; esac
            echo "Försöker $namn: $url"
            curl -fsSL -A "$UA" -o "hogtalare/bilder/$namn.img" "$url" || { echo "misslyckades"; rm -f "hogtalare/bilder/$namn.img"; }
          }
          ogbild() {
            curl -fsSL -A "$UA" "$1" 2>/dev/null | grep -oE '<meta[^>]+og:image[^>]+>' | grep -oE 'content="[^"]+"' | head -1 | sed 's/content="//;s/"$//' | sed 's/&amp;/\&/g'
          }
          kor() {
            prefix="$1"; shift; n=0
            for sida in "$@"; do
              n=$((n+1)); u=$(ogbild "$sida" || true); echo "og $prefix-$n: $u"; if [ -n "$u" ]; then hamta "$prefix-$n" "$u"; fi
            done
            return 0
          }
          hamta "sams-k1" "https://www.komplett.no/img/p/1200/1336770.jpg"
          hamta "sams-k2" "https://www.komplett.no/img/p/1200/1336771.jpg"
          html=$(curl -fsSL -A "$UA" "https://www.samsung.com/se/audio-devices/wireless-speaker/ls51h-white-hw-ls51h-xe/" || true)
          n=0
          for u in $(echo "$html" | grep -oE '(https:)?//images\.samsung\.com/is/image/samsung/p6pim/se/hw-ls51h[^"'"'"' ?]*' | awk '!seen[$0]++' | head -6); do
            n=$((n+1)); hamta "sams-s$n" "$u?\$720_576_PNG\$"
          done
          file hogtalare/bilder/*.img || true
      - name: Spara bilderna i grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hogtalare/bilder
          git commit -m "Lägg till bildkandidater för Samsung Music Studio 5" || echo "Inga nya bilder"
          git push origin hogtalare-svart-ok
