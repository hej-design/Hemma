name: Hämta produktbilder till högtalarsidan

on:
  push:
    branches: [hogtalare-fler]
    paths: [".github/workflows/hamta-bilder.yml"]

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hogtalare-fler
      - name: Ladda ner bilder och kontrollera butikssidor
        run: |
          mkdir -p hogtalare/bilder
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          hamta() {
            namn="$1"; url="$2"
            case "$url" in //*) url="https:$url" ;; esac
            echo "Försöker $namn: $url"
            curl -fsSL -A "$UA" -o "hogtalare/bilder/$namn.img" "$url" || { echo "misslyckades"; rm -f "hogtalare/bilder/$namn.img"; }
          }
          ogbild() {
            curl -fsSL -A "$UA" "$1" 2>/dev/null | grep -oE '<meta[^>]+og:image[^>]+>' | grep -oE 'content="[^"]+"' | head -1 | sed 's/content="//;s/"$//' | sed 's/&amp;/\&/g'
          }
          n=0
          for sida in \
            "https://www.kjell.com/se/varumarken/google/smarta-hem/smarta-hogtalare/google-home-speaker-smart-hogtalare-med-gemini-porcelain-p52067" \
            "https://www.currys.co.uk/products/google-home-speaker-2026-porcelain-10291566.html" \
            "https://www.johnlewis.com/google-home-bluetooth-wi-fi-speaker-with-gemini/porcelain/p114921742" \
            "https://www.argos.co.uk/product/7795222"; do
            n=$((n+1)); u=$(ogbild "$sida"); echo "og $n: $u"; [ -n "$u" ] && hamta "gpor-$n" "$u"
          done
          file hogtalare/bilder/gpor-* || true
      - name: Spara bilderna i grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hogtalare/bilder
          git commit -m "Lägg till produktbilder på Google Home Speaker" || echo "Inga nya bilder"
          git push origin hogtalare-fler
