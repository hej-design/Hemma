name: Hämta produktbilder till högtalarsidan

on:
  push:
    branches: [hogtalare-fler]
    paths: [".github/workflows/hamta-bilder.yml"]

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hogtalare-fler
      - name: Ladda ner bilder och kontrollera butikssidor
        run: |
          mkdir -p hogtalare/bilder
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          hamta() {
            namn="$1"; url="$2"
            case "$url" in //*) url="https:$url" ;; esac
            echo "Försöker $namn: $url"
            curl -fsSL -A "$UA" -o "hogtalare/bilder/$namn.img" "$url" || { echo "misslyckades"; rm -f "hogtalare/bilder/$namn.img"; }
          }
          ogbild() {
            curl -fsSL -A "$UA" "$1" 2>/dev/null | grep -oE '<meta[^>]+og:image[^>]+>' | grep -oE 'content="[^"]+"' | head -1 | sed 's/content="//;s/"$//' | sed 's/&amp;/\&/g'
          }
          g="https://lh3.googleusercontent.com/lMBHQyLSQg9IrUKBHOzTgF-iPqP9qPpWbe3MWO_cNZeZcWomvcHQxq1OrCd5isLZTfNuoxy5vmle3YvvenTaDxDHdrz_sVyktAgR"
          hamta "gstor-1" "$g=s0"
          hamta "gstor-2" "$g=w1400"
          hamta "gstor-3" "$g=w1200-h600-rw"
          curl -fsSL -A "$UA" "https://store.google.com/se/product/google_home_speaker?hl=sv" | grep -oE 'lMBHQyLSQg9IrUKBHOzTgF[^"'"'"' ]{0,200}' | head -5 || true
          file hogtalare/bilder/gstor-* || true
      - name: Spara bilderna i grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hogtalare/bilder
          git commit -m "Lägg till större bild på Google Home Speaker" || echo "Inga nya bilder"
          git push origin hogtalare-fler
