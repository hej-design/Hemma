name: Hämta produktbild till högtalarsidan

on:
  push:
    branches: [hogtalare-utan-apple]
    paths: [".github/workflows/hamta-bilder.yml"]

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hogtalare-utan-apple
      - name: Ladda ner bilder på Echo Dot Max i vitt
        run: |
          mkdir -p hogtalare/bilder
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          i=0
          hamta() {
            url="$1"
            case "$url" in //*) url="https:$url" ;; esac
            i=$((i+1))
            echo "Försöker $url"
            curl -fsSL -A "$UA" -o "hogtalare/bilder/echo-kandidat-$i.img" "$url" || { echo "misslyckades"; rm -f "hogtalare/bilder/echo-kandidat-$i.img"; }
          }
          for butik in https://www.jbhifi.com.au https://www.jbhifi.co.nz; do
            json=$(curl -fsSL -A "$UA" "$butik/products/amazon-echo-dot-max-glacier-white.js" || true)
            for u in $(echo "$json" | jq -r '.images[]?' 2>/dev/null | head -3); do hamta "$u"; done
          done
          for sida in \
            "https://www.johnlewis.com/amazon-echo-dot-max-2025-smart-speaker-with-alexa-voice-recognition-control-built-in-smart-home-hub/glacier-white/p114464138" \
            "https://www.argos.co.uk/product/7829686" \
            "https://www.officeworks.com.au/shop/officeworks/p/amazon-dot-max-glacier-white-amdotmaxgw" \
            "https://www.thegoodguys.com.au/amazon-echo-dot-max-glacier-white-b0dklwz95c"; do
            u=$(curl -fsSL -A "$UA" "$sida" 2>/dev/null | grep -oE '<meta[^>]+og:image[^>]+>' | grep -oE 'content="[^"]+"' | head -1 | sed 's/content="//;s/"$//' | sed 's/&amp;/\&/g')
            [ -n "$u" ] && hamta "$u"
          done
          file hogtalare/bilder/echo-kandidat-* || true
      - name: Spara bilderna i grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hogtalare/bilder
          git commit -m "Lägg till bildkandidater för Echo Dot Max" || echo "Inga nya bilder"
          git push origin hogtalare-utan-apple
