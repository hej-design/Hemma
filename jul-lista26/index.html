<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Önskelistor – Helgars Jul 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600&display=swap">
<style>
/* En kolumn: kodsteg, namnsteg, sedan flikar per person med en lista under. */
:root {
  --bg: #F4F1EA;
  --surface: #FFFDF8;
  --fg: #1E2420;
  --muted: #5B625C;
  --line: #DDD6C8;
  --green: #2E5B45;
  --green-bg: #E1ECE4;
  --red: #9A2F2B;
  --red-bg: #F5E3DF;
  --gold: #A67C2E;
  --on-green: #FFFFFF;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
/* Sidan är alltid ljus: två foton i bakgrunden med ett vitt, genomskinligt lager över. */
:root { color-scheme: light; }
* { box-sizing: border-box; }
.bg {
  position: fixed;
  inset: 0;
  z-index: -2;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.bg > div { background-size: cover; background-position: center; }
.bg-a { background-image: url("bilder/stjarna.jpg"); background-position: 40% 45%; }
.bg-b { background-image: url("bilder/bord.jpg"); background-position: 60% 40%; }
.veil {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(180deg, rgba(250, 247, 241, .70) 0%, rgba(250, 247, 241, .80) 100%);
}
@media (max-width: 700px) {
  .bg { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
}
.topbar {
  background: rgba(255, 253, 248, .88);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(221, 214, 200, .9);
}
.topbar-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 26px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px));
}
.eyebrow {
  margin: 0 0 6px;
  color: var(--gold);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .02em;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 650;
  font-size: clamp(30px, 7vw, 40px);
  line-height: 1.1;
  letter-spacing: -.01em;
}
h2 {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 24px;
  line-height: 1.2;
}
.who {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 15px;
}
.who strong { color: var(--fg); font-weight: 600; }
.note { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
.card {
  background: rgba(255, 253, 248, .93);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 2px 12px rgba(60, 45, 30, .06);
}
/* Rubrik och förklaring ovanför listan får en egen ljus yta så att de syns mot bilderna. */
.panel-head {
  background: rgba(255, 253, 248, .82);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border-radius: 14px;
  padding: 14px 16px 2px;
  margin-bottom: 12px;
}
.stack > * + * { margin-top: 12px; }
label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.hint { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="password"] {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  font: inherit;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
}
input:focus-visible, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}
button {
  font: inherit;
  font-weight: 600;
  min-height: 44px;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid transparent;
  cursor: pointer;
}
button:disabled { opacity: .55; cursor: default; }
.primary { background: var(--green); color: var(--on-green); }
.secondary { background: transparent; color: var(--fg); border-color: var(--line); }
.quiet {
  background: none;
  border: none;
  color: var(--green);
  padding: 0 4px;
  min-height: 32px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.danger { background: var(--red-bg); color: var(--red); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.error { color: var(--red); font-weight: 500; margin: 8px 0 0; }

/* Namnval */
.names { display: flex; flex-wrap: wrap; gap: 8px; }

/* Flikar per person */
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 10px;
  margin: 0 -2px 12px;
  scrollbar-width: thin;
}
.tab {
  flex: 0 0 auto;
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 999px;
  min-height: 40px;
  padding: 8px 14px;
  font-weight: 500;
}
.tab .count { color: var(--muted); font-weight: 500; margin-left: 4px; }
.tab[aria-selected="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.tab[aria-selected="true"] .count { color: inherit; opacity: .8; }

/* Önskningar */
.wishes { list-style: none; margin: 16px 0 0; padding: 0; }
.wishes > li + li { margin-top: 10px; }
.wish-title { margin: 0; font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.wish-title a { color: var(--fg); text-decoration-color: var(--green); text-underline-offset: 3px; }
.domain { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.domain a { color: var(--green); }
.comment { margin: 6px 0 0; font-size: 15px; overflow-wrap: anywhere; }
.actions { margin-top: 12px; }
.badge {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
}
.badge.mine { background: var(--green-bg); color: var(--green); }
.badge.taken { background: var(--red-bg); color: var(--red); }
.wish.is-taken .wish-title, .wish.is-taken .comment { color: var(--muted); }
.empty { color: var(--muted); padding: 8px 0; }

footer { margin-top: 32px; color: var(--muted); font-size: 14px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: max(20px, env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  background: var(--fg);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 15px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18);
}
.toast[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="bg-a"></div><div class="bg-b"></div></div>
<div class="veil" aria-hidden="true"></div>
<header class="topbar">
  <div class="topbar-inner">
    <p class="eyebrow">Helgars Jul 2026</p>
    <h1>Önskelistor</h1>
    <p class="who" id="who" hidden></p>
  </div>
</header>
<div class="wrap">
  <main id="app" aria-live="polite"></main>
  <footer id="footer" hidden></footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// Adressen till Google Apps Script-kopplingen (skriptet ligger i arket Julklappsönskningar 2026).
const API_URL = 'https://script.google.com/macros/s/AKfycbxVxTQAHGXs3y-0KebcDCmmi71mTbCnZ_aUJemV59JpNHL_ndbQp_9Zle5wqkK2HORK/exec';

const POLL_MS = 30000;
const TIMEOUT_MS = 20000;
const KEY_KOD = 'jul26.kod';
const KEY_NAMN = 'jul26.namn';

// Webbläsarens lagring kan saknas eller vara avstängd; sidan ska fungera ändå.
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const state = {
  kod: store.get(KEY_KOD),
  namn: store.get(KEY_NAMN),
  items: [],
  personer: [],
  view: 'kod',
  selected: null,
  draft: { onskan: '', lank: '', kommentar: '' },
  adding: false,
  editing: null,
  editDraft: null,
  confirming: null,
  busy: new Set(),
  loading: false,
  error: '',
  updated: null,
  pendingRender: false
};

/* ---------- Koppling ---------- */

async function request(url, options) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(url, Object.assign({ signal: ctrl.signal, redirect: 'follow' }, options || {}));
    if (!res.ok) throw new Error('http ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function apiGet(kod) {
  return request(API_URL + (API_URL.includes('?') ? '&' : '?') + 'kod=' + encodeURIComponent(kod));
}

function apiPost(payload) {
  // text/plain gör att webbläsaren skickar direkt utan förfrågan i förväg, vilket Apps Script kräver.
  return request(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ kod: state.kod }, payload))
  });
}

/* ---------- Hjälpare ---------- */

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

function safeHref(url) {
  return /^https?:\/\//i.test(url || '') ? url : '';
}

// Plockar ut själva webbadressen ur inklistrad text, till exempel en delningstext från en app:
// "Fantastisk produkt från Zalando: … https://www.zalando.se/…". Ger '' om ingen adress finns.
function extractUrl(text) {
  const t = String(text || '').trim();
  if (!t) return '';
  const hits = t.match(/https?:\/\/[^\s<>"']+/gi) || [];
  for (const hit of hits) {
    try {
      const u = new URL(hit);
      if (u.hostname.includes('.')) return u.href;
    } catch (e) {}
  }
  const words = t.split(/\s+/).filter(w => /^[^\s]+\.[a-z]{2,}(\/\S*)?$/i.test(w) && !w.includes('@'));
  if (words.length) {
    try { return new URL('https://' + words[words.length - 1].replace(/^https?:\/\//i, '')).href; } catch (e) {}
  }
  return '';
}

function domainOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
}

function genitive(name) {
  return /[sxz]$/i.test(name) ? name : name + 's';
}

function sameName(a, b) {
  return String(a).trim().toLocaleLowerCase('sv') === String(b).trim().toLocaleLowerCase('sv');
}

function persons() {
  const set = new Map();
  // Sparade personer (även de utan önskningar) plus alla som har önskningar.
  for (const p of [...state.personer, ...state.items.map(it => it.person)]) {
    if (p && !set.has(p.toLocaleLowerCase('sv'))) set.set(p.toLocaleLowerCase('sv'), p);
  }
  if (state.namn && !set.has(state.namn.toLocaleLowerCase('sv'))) set.set(state.namn.toLocaleLowerCase('sv'), state.namn);
  const others = [...set.values()].filter(p => !sameName(p, state.namn)).sort((a, b) => a.localeCompare(b, 'sv'));
  return state.namn ? [state.namn, ...others] : others;
}

function wishesOf(person) {
  return state.items
    .filter(it => sameName(it.person, person))
    .sort((a, b) => String(a.skapad).localeCompare(String(b.skapad)));
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
}

function timeStr(d) {
  return d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
}

/* ---------- Hämta och spara ---------- */

async function load(opts) {
  const silent = opts && opts.silent;
  if (!API_URL || !state.kod) return;
  if (!silent) { state.loading = true; state.error = ''; render(); }
  try {
    const res = await apiGet(state.kod);
    if (!res.ok && res.fel === 'kod') {
      store.del(KEY_KOD);
      state.kod = '';
      state.view = 'kod';
      state.error = 'Koden stämmer inte. Kontrollera stavningen och försök igen.';
      state.loading = false;
      render();
      return;
    }
    if (!res.ok) throw new Error(res.fel || 'fel');
    state.items = res.items || [];
    if (res.personer) state.personer = res.personer;
    state.updated = new Date();
    state.error = '';
    if (state.view === 'kod' || state.view === 'start') state.view = 'namn';
  } catch (e) {
    if (!silent) state.error = 'Det gick inte att hämta listorna just nu. Kontrollera uppkopplingen och försök igen.';
  }
  state.loading = false;
  renderSoon();
}

async function save(id, payload, okMsg) {
  if (id) state.busy.add(id);
  render();
  try {
    const res = await apiPost(payload);
    if (res.items) { state.items = res.items; state.updated = new Date(); }
    if (res.personer) state.personer = res.personer;
    if (!res.ok) {
      if (res.fel === 'kod') { store.del(KEY_KOD); state.kod = ''; state.view = 'kod'; }
      else if (res.fel === 'upptagen') toast('Någon hann före dig. Den är redan tagen.');
      else if (res.fel === 'saknas') toast('Önskningen finns inte längre.');
      else toast('Det gick inte att spara. Försök igen.');
      return false;
    }
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    toast('Det gick inte att spara. Kontrollera uppkopplingen och försök igen.');
    return false;
  } finally {
    if (id) state.busy.delete(id);
    render();
  }
}

/* ---------- Vyer ---------- */

function viewKod() {
  if (!API_URL) {
    return h('div', { class: 'card stack' },
      h('h2', null, 'Snart klart'),
      h('p', { class: 'note' }, 'Sidan är inte kopplad till listorna ännu. Titta in igen om en stund.')
    );
  }
  const input = h('input', { type: 'password', id: 'kod', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', required: true });
  const form = h('form', {
    class: 'card stack',
    onsubmit: e => {
      e.preventDefault();
      const v = input.value.trim();
      if (!v) return;
      state.kod = v;
      store.set(KEY_KOD, v);
      load();
    }
  },
    h('h2', null, 'Välkommen'),
    h('p', { class: 'note' }, 'Skriv familjekoden. Den finns i meddelandet du fick tillsammans med länken.'),
    h('div', null, h('label', { for: 'kod' }, 'Familjekod'), input),
    state.error ? h('p', { class: 'error', role: 'alert' }, state.error) : null,
    h('button', { class: 'primary', type: 'submit', disabled: state.loading }, state.loading ? 'Kontrollerar …' : 'Fortsätt')
  );
  setTimeout(() => input.focus(), 0);
  return form;
}

function chooseName(name) {
  const existing = persons().find(p => sameName(p, name));
  state.namn = existing || name.trim();
  store.set(KEY_NAMN, state.namn);
  state.selected = state.namn;
  state.view = 'listor';
  render();
  // En ny lista sparas direkt, så att den finns kvar även innan man har lagt till något.
  if (!state.personer.some(p => sameName(p, state.namn))) {
    state.personer = [...state.personer, state.namn];
    apiPost({ action: 'person', namn: state.namn })
      .then(res => { if (res && res.personer) { state.personer = res.personer; renderSoon(); } })
      .catch(() => {});
  }
}

// Visas varje gång sidan öppnas, så att den som lånar någon annans telefon eller dator alltid kan välja sig själv.
function viewNamn() {
  const remembered = state.namn;
  const others = persons().filter(p => !sameName(p, remembered));
  const input = h('input', { type: 'text', id: 'namn', autocomplete: 'off', maxlength: '60' });
  return h('div', { class: 'card stack' },
    h('h2', null, 'Vem är du?'),
    remembered
      ? h('div', null,
          h('button', { class: 'primary', type: 'button', onclick: () => chooseName(remembered) }, 'Fortsätt som ' + remembered)
        )
      : null,
    others.length ? h('div', null,
      h('p', { class: 'note' }, remembered ? 'Är du någon annan? Välj ditt namn:' : 'Välj ditt namn om du redan har en lista:'),
      h('div', { class: 'names' },
        others.map(p => h('button', { class: 'secondary', type: 'button', onclick: () => chooseName(p) }, p))
      )
    ) : null,
    h('form', {
      class: 'stack',
      onsubmit: e => { e.preventDefault(); if (input.value.trim()) chooseName(input.value); }
    },
      h('div', null,
        h('label', { for: 'namn' }, (remembered || others.length) ? 'Ny här? Skriv ditt namn så skapas din lista' : 'Skriv ditt namn så skapas din lista'),
        input
      ),
      h('button', { class: 'secondary', type: 'submit' }, 'Skapa min lista')
    )
  );
}

// Fälten sparas i state.draft medan man skriver, så att inget försvinner om sidan ritas om.
function field(id, draft, key, extra) {
  return h('input', Object.assign({
    type: 'text', id, value: draft[key],
    oninput: e => { draft[key] = e.target.value; }
  }, extra || {}));
}

function addForm() {
  const d = state.draft;
  const onskan = field('f-onskan', d, 'onskan', { maxlength: '200', required: true });
  const lank = field('f-lank', d, 'lank', { inputmode: 'url', autocapitalize: 'none', spellcheck: 'false', placeholder: 'https://' });
  const kommentar = field('f-kommentar', d, 'kommentar', { maxlength: '300', placeholder: 'Till exempel storlek eller färg' });
  return h('form', {
    class: 'card stack',
    onsubmit: async e => {
      e.preventDefault();
      if (state.adding) return;
      if (!d.onskan.trim()) { onskan.focus(); return; }
      const cleanLank = extractUrl(d.lank);
      if (d.lank.trim() && !cleanLank) { toast('Länken ser inte ut som en webbadress. Kontrollera den och försök igen.'); lank.focus(); return; }
      state.adding = true;
      const ok = await save(null, {
        action: 'add',
        person: state.namn,
        onskan: d.onskan.trim(),
        lank: cleanLank,
        kommentar: d.kommentar.trim()
      }, 'Önskningen är tillagd.');
      state.adding = false;
      if (ok) state.draft = { onskan: '', lank: '', kommentar: '' };
      render();
    }
  },
    h('div', null, h('label', { for: 'f-onskan' }, 'Vad önskar du dig?'), onskan),
    h('div', null, h('label', { for: 'f-lank' }, 'Länk ', h('span', { class: 'hint' }, '(valfri)')), lank),
    h('div', null, h('label', { for: 'f-kommentar' }, 'Kommentar ', h('span', { class: 'hint' }, '(valfri)')), kommentar),
    h('button', { class: 'primary', type: 'submit', disabled: state.adding }, state.adding ? 'Sparar …' : 'Lägg till önskan')
  );
}

function wishBody(it) {
  const href = safeHref(extractUrl(it.lank));
  return [
    h('p', { class: 'wish-title' }, href ? h('a', { href, target: '_blank', rel: 'noopener noreferrer' }, it.onskan) : it.onskan),
    href ? h('p', { class: 'domain' }, h('a', { href, target: '_blank', rel: 'noopener noreferrer' }, 'Öppna länken på ' + (domainOf(href) || 'webben') + ' ↗')) : null,
    it.kommentar ? h('p', { class: 'comment' }, it.kommentar) : null
  ];
}

function startEdit(it) {
  state.editing = it.id;
  state.editDraft = { onskan: it.onskan, lank: it.lank, kommentar: it.kommentar };
  state.confirming = null;
  render();
  const el = document.getElementById('e-onskan');
  if (el) el.focus();
}

function stopEdit() {
  state.editing = null;
  state.editDraft = null;
  render();
}

function editCard(it) {
  const d = state.editDraft || { onskan: it.onskan, lank: it.lank, kommentar: it.kommentar };
  state.editDraft = d;
  const onskan = field('e-onskan', d, 'onskan', { maxlength: '200', required: true });
  const lank = field('e-lank', d, 'lank', { inputmode: 'url', autocapitalize: 'none', spellcheck: 'false' });
  const kommentar = field('e-kommentar', d, 'kommentar', { maxlength: '300' });
  const busy = state.busy.has(it.id);
  return h('li', { class: 'card' },
    h('form', {
      class: 'stack',
      onsubmit: async e => {
        e.preventDefault();
        if (busy) return;
        if (!d.onskan.trim()) { onskan.focus(); return; }
        const cleanLank = extractUrl(d.lank);
        if (d.lank.trim() && !cleanLank) { toast('Länken ser inte ut som en webbadress. Kontrollera den och försök igen.'); lank.focus(); return; }
        const ok = await save(it.id, {
          action: 'update', id: it.id,
          onskan: d.onskan.trim(), lank: cleanLank, kommentar: d.kommentar.trim()
        }, 'Ändringen är sparad.');
        if (ok) stopEdit();
      }
    },
      h('div', null, h('label', { for: 'e-onskan' }, 'Önskning'), onskan),
      h('div', null, h('label', { for: 'e-lank' }, 'Länk'), lank),
      h('div', null, h('label', { for: 'e-kommentar' }, 'Kommentar'), kommentar),
      h('div', { class: 'row' },
        h('button', { class: 'primary', type: 'submit', disabled: busy }, busy ? 'Sparar …' : 'Spara'),
        h('button', { class: 'secondary', type: 'button', onclick: stopEdit }, 'Avbryt')
      )
    )
  );
}

function ownWish(it) {
  if (state.editing === it.id) return editCard(it);
  const busy = state.busy.has(it.id);
  let actions;
  if (state.confirming === it.id) {
    actions = h('div', { class: 'row actions' },
      h('span', null, 'Ta bort önskningen?'),
      h('button', { class: 'danger', type: 'button', disabled: busy, onclick: async () => {
        await save(it.id, { action: 'delete', id: it.id }, 'Önskningen är borttagen.');
        state.confirming = null; render();
      } }, busy ? 'Tar bort …' : 'Ja, ta bort'),
      h('button', { class: 'secondary', type: 'button', onclick: () => { state.confirming = null; render(); } }, 'Nej')
    );
  } else {
    actions = h('div', { class: 'row actions' },
      h('button', { class: 'secondary', type: 'button', onclick: () => startEdit(it) }, 'Ändra'),
      h('button', { class: 'secondary', type: 'button', onclick: () => { state.confirming = it.id; state.editing = null; state.editDraft = null; render(); } }, 'Ta bort')
    );
  }
  return h('li', { class: 'card wish' }, wishBody(it), actions);
}

function otherWish(it) {
  const busy = state.busy.has(it.id);
  let status;
  if (!it.kopsAv) {
    status = h('button', { class: 'primary', type: 'button', disabled: busy, onclick: () =>
      save(it.id, { action: 'reserve', id: it.id, namn: state.namn }, 'Markerad. ' + it.person + ' kan inte se det.')
    }, busy ? 'Markerar …' : 'Jag köper den');
  } else if (sameName(it.kopsAv, state.namn)) {
    status = [
      h('span', { class: 'badge mine' }, 'Du köper den'),
      h('button', { class: 'quiet', type: 'button', disabled: busy, onclick: () =>
        save(it.id, { action: 'unreserve', id: it.id, namn: state.namn }, 'Markeringen är borttagen.')
      }, busy ? 'Ångrar …' : 'Ångra')
    ];
  } else {
    status = h('span', { class: 'badge taken' }, 'Köps av ' + it.kopsAv);
  }
  const taken = it.kopsAv && !sameName(it.kopsAv, state.namn);
  return h('li', { class: 'card wish' + (taken ? ' is-taken' : '') }, wishBody(it), h('div', { class: 'row actions' }, status));
}

function viewListor() {
  const list = persons();
  if (!state.selected || !list.some(p => sameName(p, state.selected))) state.selected = state.namn;
  const sel = list.find(p => sameName(p, state.selected)) || state.namn;
  const mine = sameName(sel, state.namn);
  const wishes = wishesOf(sel);

  const tabs = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Listor' },
    list.map(p => h('button', {
      class: 'tab', type: 'button', role: 'tab',
      'aria-selected': sameName(p, sel) ? 'true' : 'false',
      onclick: () => { state.selected = p; state.editing = null; state.confirming = null; render(); }
    }, sameName(p, state.namn) ? 'Min lista' : p, h('span', { class: 'count' }, String(wishesOf(p).length))))
  );

  const panel = mine
    ? h('section', { role: 'tabpanel' },
        h('div', { class: 'panel-head' },
          h('h2', null, 'Din önskelista'),
          h('p', { class: 'note' }, 'Det du lägger till syns direkt för de andra. Du ser aldrig vad som är köpt på din egen lista.')
        ),
        addForm(),
        wishes.length
          ? h('ul', { class: 'wishes' }, wishes.map(ownWish))
          : h('p', { class: 'empty' }, 'Du har inte lagt till några önskningar än.')
      )
    : h('section', { role: 'tabpanel' },
        h('div', { class: 'panel-head' },
          h('h2', null, genitive(sel) + ' önskelista'),
          h('p', { class: 'note' }, sel + ' ser inte vad som är markerat som köpt.')
        ),
        wishes.length
          ? h('ul', { class: 'wishes' }, wishes.map(otherWish))
          : h('p', { class: 'empty' }, sel + ' har inte lagt till några önskningar än.')
      );

  return h('div', null, tabs, panel);
}

/* ---------- Rendering ---------- */

function userIsTyping() {
  const a = document.activeElement;
  return state.editing || (a && a.tagName === 'INPUT' && document.getElementById('app').contains(a));
}

// Uppdateringar i bakgrunden väntar tills ingen skriver i ett fält.
function renderSoon() {
  if (state.view === 'listor' && userIsTyping()) { state.pendingRender = true; return; }
  render();
}

function render() {
  state.pendingRender = false;
  const app = document.getElementById('app');
  const who = document.getElementById('who');
  const footer = document.getElementById('footer');

  let view;
  if (state.view === 'kod' || !state.kod) view = viewKod();
  else if (state.view === 'start') view = state.error
    ? h('div', { class: 'card stack' },
        h('p', { class: 'error', role: 'alert' }, state.error),
        h('button', { class: 'primary', type: 'button', onclick: () => load() }, 'Försök igen'))
    : h('p', { class: 'note' }, 'Hämtar listorna …');
  else if (state.view === 'namn' || !state.namn) view = viewNamn();
  else view = viewListor();
  app.replaceChildren(view);

  if (state.view === 'listor' && state.namn) {
    who.hidden = false;
    who.replaceChildren('Du är ', h('strong', null, state.namn), ' · ',
      h('button', { class: 'quiet', type: 'button', onclick: () => { state.view = 'namn'; render(); } }, 'Byt person'));
  } else {
    who.hidden = true;
  }

  if (state.view === 'listor' && state.kod) {
    footer.hidden = false;
    footer.replaceChildren(...[
      h('p', null, 'Listorna uppdateras av sig själva var 30:e sekund.' + (state.updated ? ' Senast hämtade ' + timeStr(state.updated) + '.' : '')),
      state.error ? h('p', { class: 'error' }, state.error) : null,
      h('button', { class: 'secondary', type: 'button', onclick: () => load() }, 'Uppdatera nu')
    ].filter(Boolean));
  } else {
    footer.hidden = true;
  }
}

document.addEventListener('focusout', () => {
  setTimeout(() => { if (state.pendingRender && !userIsTyping()) render(); }, 150);
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.view === 'listor') load({ silent: true });
});

setInterval(() => {
  if (!document.hidden && state.view === 'listor') load({ silent: true });
}, POLL_MS);

if (state.kod && API_URL) { state.view = 'start'; load(); }
render();
</script>
</body>
</html>
